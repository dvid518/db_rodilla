<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito - Cafetería Rodilla</title>
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="css/header.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">Rodilla <span>Café</span></div>
            <nav class="nav"></nav>
        </div>
    </header>

    <main class="page">
        <section class="hero">
            <h1 class="hero-title">🛒 Mi Carrito</h1>
            <p class="hero-sub">Revisa tus productos antes de comprar</p>
        </section>

        <!-- Carrito vacío -->
        <section id="empty" class="card" style="text-align:center; padding:40px; border-radius:14px; display:none;">
            <div style="font-size:64px; margin-bottom:16px;">🛒</div>
            <h3 style="margin:8px 0 4px; color:#2E5A3B;">Carrito vacío</h3>
            <p class="hero-sub">No tienes productos en tu carrito. ¡Explora nuestro catálogo!</p>
            <a href="catalogo.html" class="btn btn-primary" style="display:inline-block; margin-top:16px;">Ver
                Catálogo</a>
        </section>

        <!-- Lista de productos -->
        <div id="list" class="list" style="display:none; gap:12px;"></div>

        <!-- Resumen -->
        <div id="summary" class="card"
            style="display:none; margin-top:20px; padding:16px 20px; border-radius:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div style="font-size:18px;">
                <strong>💰 Total:</strong>
                <span id="total" style="color:#2E5A3B; font-size:22px; font-weight:bold;">S/ 0.00</span>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-secondary" type="button" onclick="window.vaciarCarrito()">🗑️ Vaciar</button>
                <button class="btn btn-primary" type="button" onclick="window.comprar()">✅ Comprar</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/carrito.js"></script>
</body>

</html>
