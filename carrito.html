<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito - Cafetería Rodilla</title>
    <link rel="stylesheet" href="css/catalogo.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">Rodilla <span>Café</span></div>
            <nav class="nav"></nav>
        </div>
    </header>

    <main class="page">
        <section id="empty" class="card" style="text-align:center; padding:28px; border-radius:14px; display:none">
            <div>
                <img src="Iconos/bolsa-de-la-compra.png" class="empty-cart-icon" alt="Carrito vacío">
            </div>
            <h3 style="margin:8px 0 0">Carrito vacío</h3>
            <p class="hero-sub">No tienes productos en tu carrito. ¡Explora nuestro catálogo!</p>
        </section>

        <div id="list" class="list" style="display:none; gap:12px"></div>

        <div id="summary" class="card"
            style="display:none; margin-top:12px; padding:14px; border-radius:12px; align-items:center; justify-content:space-between">
            <div><strong>Total:</strong> <span id="total">S/ 0.00</span></div>
            <div style="display:flex; gap:8px">
                <button class="btn btn-secondary" type="button" onclick="vaciarCarrito()">Vaciar</button>
                <button class="btn btn-primary" type="button" onclick="comprar()">Comprar</button>
            </div>
        </div>
    </main>

    <script type="importmap">
        {
            "imports": {
                "@neondatabase/serverless": "https://cdn.jsdelivr.net/npm/@neondatabase/serverless@0.10.0/+esm"
            }
        }
        </script>
    <script type="module" src="js/db-config.js"></script>
    <script type="module" src="js/db-postgres.js"></script>
    <script type="module" src="js/db-mongo.js"></script>
    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/catalogo.js"></script>
</body>

</html>
