<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cuenta - Cafetería Rodilla</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">Rodilla <span>Café</span></div>
            <nav class="nav">
                <a href="catalogo.html" class="link">Catálogo</a>
                <a href="login.html" class="btn btn-primary">Iniciar Sesión</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <section class="panel">
            <h1 class="title text-center">Crear Cuenta</h1>
            <p class="subtitle text-center">Únete a nuestra cafetería</p>

            <form id="registroForm" class="form visible">
                <label>Nombre completo *</label>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required>

                <label>Email *</label>
                <input type="email" id="email" placeholder="tu@email.com" required>

                <label>Teléfono</label>
                <input type="tel" id="telefono" placeholder="987654321">

                <label>Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">

                <button class="btn btn-primary" type="submit">Crear Cuenta</button>
            </form>

            <p class="hint">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>
        </section>
    </main>

    <script src="js/db-config.js"></script>
    <script src="js/db-postgres.js"></script>
    <script src="js/registro.js"></script>
</body>

</html>
